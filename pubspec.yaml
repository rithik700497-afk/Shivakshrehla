name: royal_feast_app
description: Royal Feast — native ordering app (Flutter) for the Royal Feast restaurant backend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ">=14.0.0 <20.0.0"
  http: ^1.2.2
  flutter_secure_storage: ">=9.0.0 <11.0.0"
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  intl: ">=0.19.0 <1.0.0"
  url_launcher: ^6.3.0
  connectivity_plus: ">=6.0.0 <9.0.0"
  razorpay_flutter: ^1.3.7
  firebase_core: ">=3.0.0 <6.0.0"
  firebase_messaging: ">=15.0.0 <20.0.0"
  flutter_local_notifications: ">=17.0.0 <21.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
